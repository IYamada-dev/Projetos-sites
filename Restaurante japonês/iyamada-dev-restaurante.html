<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IYamada-Dev — Restaurante Japonês</title>
<meta name="description" content="IYamada-Dev — cardápio, carrinho e pagamento ilustrativo de um restaurante japonês fictício.">
<meta property="og:title" content="IYamada-Dev">
<meta property="og:description" content="Cardápio, carrinho e pagamento de um restaurante japonês fictício.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23c23b33'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f3e7d6'%3E家%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#120c17;
    --bg-1:#1c1420;
    --bg-2:#271b2d;
    --bg-3:#332338;
    --red:#c23b33;
    --red-deep:#8a241f;
    --red-glow:rgba(194,59,51,.45);
    --gold:#cda43e;
    --gold-soft:#e4c877;
    --cream:#f3e7d6;
    --ink:#e9dcc8;
    --ink-dim:#b9a98f;
    --pink:#e9aeb9;
    --ok:#5fa96b;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Zen Maru Gothic', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #2a1b2f 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #241726 0%, transparent 50%),
      var(--bg-0);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:17px;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input{font-family:inherit; color:inherit;}

  :focus-visible{
    outline:2px solid var(--gold-soft);
    outline-offset:3px;
    border-radius:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ---------- splash ---------- */
  .splash{
    position:fixed; inset:0; z-index:200;
    background:var(--bg-0);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s;
  }
  .splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash .seal{
    width:84px; height:84px; font-size:38px;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }

  /* ---------- layout shell ---------- */
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- header ---------- */
  header{
    padding:34px 20px 18px;
    text-align:center;
    position:relative;
    z-index:5;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  .seal{
    width:44px; height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #e15b50, var(--red) 55%, var(--red-deep) 100%);
    box-shadow:0 6px 16px var(--red-glow), inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:20px;
    color:var(--cream);
    flex:none;
  }

  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(28px,7vw,38px);
    letter-spacing:.5px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold) 60%, #a17d24);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
  }

  .brand-underline{
    width:66px; height:3px; margin:10px auto 0;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    border-radius:2px;
    opacity:.8;
  }

  .slogan{
    margin-top:10px;
    font-family:var(--font-display);
    font-size:14px;
    color:var(--ink-dim);
    letter-spacing:.4px;
  }

  /* ---------- nav ---------- */
  nav.tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:22px auto 0;
    padding:6px;
    background:var(--bg-1);
    border-radius:22px;
    width:max-content;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 10px 24px rgba(0,0,0,.35);
  }

  nav.tabs button{
    width:56px; height:44px;
    border-radius:16px;
    font-size:22px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:background .3s ease, transform .25s ease;
  }

  nav.tabs button.active{
    background:linear-gradient(160deg, var(--red), var(--red-deep));
    box-shadow:0 6px 14px var(--red-glow);
    transform:translateY(-2px);
  }

  .badge{
    position:absolute;
    top:-4px; right:-4px;
    min-width:19px; height:19px;
    padding:0 4px;
    border-radius:50%;
    background:var(--gold);
    color:#2a1c05;
    font-size:11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  /* ---------- stage (where the 3 views live) ---------- */
  .stage{
    position:relative;
    flex:1;
    padding:26px 18px 40px;
    overflow:hidden;
  }

  .view{
    display:none;
    animation:rise .5s ease both;
  }
  .view.active{ display:block; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- shoji sliding-door transition overlay ---------- */
  .shoji{
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;
  }
  .leaf{
    position:absolute;
    top:0; bottom:0;
    width:50%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 46px),
      linear-gradient(160deg, #ede1cd, #e2d2b4 45%, #d8c39d 100%);
    box-shadow: inset 0 0 40px rgba(80,50,20,.25);
    transition: transform .42s cubic-bezier(.76,0,.24,1);
  }
  .leaf.l{ left:0; transform:translateX(-102%); border-right:3px solid var(--red-deep); }
  .leaf.r{ right:0; transform:translateX(102%); border-left:3px solid var(--red-deep); }
  .shoji.cover .leaf.l{ transform:translateX(0); }
  .shoji.cover .leaf.r{ transform:translateX(0); }

  /* ================= MENU ================= */
  .menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:380px){ .menu-grid{ grid-template-columns:1fr; } }

  .dish{
    background:linear-gradient(165deg, var(--bg-2), var(--bg-1));
    border-radius:22px;
    padding:18px 14px 16px;
    position:relative;
    box-shadow:0 14px 28px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.03);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  @media (hover:hover){
    .dish:hover{
      transform:translateY(-6px) rotate(-.4deg);
      box-shadow:0 20px 36px rgba(0,0,0,.5), 0 0 0 1px rgba(228,200,119,.15), inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .dish:hover .plate{ box-shadow:inset 0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(255,255,255,.08), 0 10px 22px var(--red-glow); }
  }

  .plate{
    width:96px; height:96px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
    background:radial-gradient(circle at 35% 30%, #fff7 0%, transparent 40%),
               radial-gradient(circle at 50% 55%, var(--bg-3), var(--bg-1) 75%);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(255,255,255,.05), 0 8px 16px rgba(0,0,0,.35);
    transition:box-shadow .3s ease;
  }
  .plate span{
    font-size:44px;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));
  }

  .dish h3{
    font-family:var(--font-display);
    font-size:18px;
    color:var(--ink);
    font-weight:500;
  }

  .dish .desc{
    margin-top:4px;
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.4;
  }

  .price{
    margin-top:6px;
    font-weight:700;
    font-size:16px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .add-btn{
    margin-top:12px;
    width:40px; height:40px;
    border-radius:50%;
    font-size:20px;
    color:var(--cream);
    background:radial-gradient(circle at 35% 30%, #e15b50, var(--red) 60%, var(--red-deep));
    box-shadow:0 8px 16px var(--red-glow);
    transition:transform .18s ease;
  }
  .add-btn:active{ transform:scale(.88); }

  /* ================= TOAST ================= */
  .toast-wrap{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%) translateY(20px);
    z-index:80;
    display:flex; flex-direction:column; gap:8px;
    align-items:center;
    pointer-events:none;
  }
  .toast{
    background:linear-gradient(160deg, var(--bg-2), var(--bg-1));
    border-radius:14px;
    padding:11px 18px;
    font-size:14px;
    color:var(--cream);
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(228,200,119,.2);
    display:flex; align-items:center; gap:8px;
    opacity:0; transform:translateY(10px);
    animation:toastIn .3s ease forwards, toastOut .3s ease 2.1s forwards;
  }
  @keyframes toastIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-8px); } }

  /* ================= CART ================= */
  .cart-list{ display:flex; flex-direction:column; gap:14px; }

  .cart-item{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-2);
    border-radius:18px;
    padding:12px 14px;
    box-shadow:0 10px 20px rgba(0,0,0,.35);
  }

  .cart-emoji{
    width:52px; height:52px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    background:radial-gradient(circle at 35% 30%, var(--bg-3), var(--bg-1));
    box-shadow:inset 0 3px 8px rgba(0,0,0,.5);
    flex:none;
  }

  .cart-info{ flex:1; min-width:0; }
  .cart-info h4{
    font-family:var(--font-display);
    font-size:16px;
    color:var(--ink);
  }
  .cart-info .price{ font-size:14px; margin-top:2px; }

  .cart-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }

  .stepper{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-1);
    border-radius:14px;
    padding:5px 8px;
  }
  .stepper button{
    width:26px; height:26px; border-radius:8px;
    background:var(--bg-3);
    font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft);
  }
  .stepper span{ min-width:16px; text-align:center; font-weight:700; }

  .remove-btn{
    font-size:12px;
    color:var(--ink-dim);
    padding:2px 4px;
    transition:color .2s ease;
  }
  .remove-btn:hover{ color:var(--red); }

  .empty-state{
    text-align:center;
    padding:50px 10px;
    color:var(--ink-dim);
  }
  .empty-state .plate{ width:110px; height:110px; margin:0 auto 18px; }
  .empty-state .plate span{ font-size:52px; opacity:.6; }
  .empty-state p{ font-family:var(--font-display); font-size:18px; }

  .total-row{
    margin-top:24px;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
    border-radius:20px;
    background:linear-gradient(160deg, var(--bg-2), var(--bg-1));
    box-shadow:0 12px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .total-row .label{ font-family:var(--font-display); font-size:17px; color:var(--ink); }
  .total-row .amount{ font-size:22px; font-weight:700; color:var(--gold-soft); }

  .cta{
    margin-top:18px;
    width:100%;
    padding:16px;
    border-radius:18px;
    font-family:var(--font-display);
    font-size:17px;
    color:var(--cream);
    background:linear-gradient(160deg, var(--red), var(--red-deep));
    box-shadow:0 12px 24px var(--red-glow);
    transition:transform .15s ease, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .cta:active{ transform:scale(.97); }
  .cta:disabled{ opacity:.35; box-shadow:none; }

  .cta.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border:2px solid rgba(243,231,214,.35);
    border-top-color:var(--cream);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ================= PAYMENT ================= */
  .pay-methods{
    display:flex; gap:10px;
  }
  .pay-methods button{
    flex:1;
    padding:16px 6px;
    border-radius:18px;
    background:var(--bg-2);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow:0 10px 20px rgba(0,0,0,.35);
    transition:box-shadow .25s ease, transform .2s ease, background .25s ease;
  }
  .pay-methods button span.ic{ font-size:26px; }
  .pay-methods button.active{
    background:linear-gradient(160deg, var(--bg-3), var(--bg-2));
    box-shadow:0 0 0 2px var(--red), 0 10px 24px var(--red-glow);
    transform:translateY(-3px);
  }

  .pay-panel{
    margin-top:22px;
    background:var(--bg-2);
    border-radius:20px;
    padding:22px 18px;
    box-shadow:0 12px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03);
    min-height:150px;
  }
  .pay-panel .row{ margin-bottom:14px; }
  .pay-panel input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    background:var(--bg-1);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
    font-size:15px;
    color:var(--ink);
    transition:box-shadow .2s ease;
  }
  .pay-panel input:focus{ box-shadow:inset 0 2px 6px rgba(0,0,0,.5), 0 0 0 2px var(--gold-soft); outline:none; }
  .pay-panel input::placeholder{ color:var(--ink-dim); }
  .row-2{ display:flex; gap:10px; }
  .row-2 input{ flex:1; }

  .qr{
    width:150px; height:150px;
    margin:0 auto 14px;
    border-radius:16px;
    background:
      repeating-conic-gradient(#191019 0% 25%, #f0e6d3 0% 50%) 0 0/24px 24px,
      linear-gradient(#f0e6d3,#f0e6d3);
    background-blend-mode:normal;
    box-shadow:0 10px 22px rgba(0,0,0,.5);
    position:relative;
  }
  .qr::after{
    content:"";
    position:absolute; inset:38%;
    background:var(--red);
    border-radius:8px;
    box-shadow:0 0 0 6px #f0e6d3;
  }
  .pix-hint{ text-align:center; color:var(--ink-dim); font-size:14px; }

  .cash-face{
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .cash-face .ic{ font-size:44px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }

  .credit{
    margin-top:30px;
    text-align:center;
    font-family:var(--font-display);
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:.3px;
  }
  .credit span{ color:var(--gold-soft); }

  /* ---------- stamp confirmation overlay ---------- */
  .stamp-overlay{
    position:fixed; inset:0;
    background:rgba(8,5,10,.82);
    display:none;
    align-items:center; justify-content:center;
    z-index:100;
  }
  .stamp-overlay.show{ display:flex; }

  .hanko{
    width:150px; height:150px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e15b50, var(--red) 60%, var(--red-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px rgba(243,231,214,.15), 0 20px 50px rgba(0,0,0,.6);
    transform:scale(2.6) rotate(-14deg);
    opacity:0;
  }
  .hanko span{
    font-family:var(--font-display);
    font-size:56px;
    color:var(--cream);
  }
  .stamp-overlay.show .hanko{
    animation:stampdown .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampdown{
    0%{ transform:scale(2.6) rotate(-14deg); opacity:0; }
    60%{ transform:scale(.92) rotate(-6deg); opacity:1; }
    80%{ transform:scale(1.06) rotate(-6deg); }
    100%{ transform:scale(1) rotate(-6deg); opacity:1; }
  }
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="seal">家</div>
</div>

<div class="app">

  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">家</div>
      <h1>IYamada-Dev</h1>
    </div>
    <div class="brand-underline"></div>

    <nav class="tabs" aria-label="Navegação">
      <button id="tab-menu" class="active" onclick="showView('menu')" aria-label="Cardápio">🏮</button>
      <button id="tab-cart" onclick="showView('cart')" aria-label="Carrinho">
        🛍️
        <span class="badge" id="cart-badge" style="display:none;">0</span>
      </button>
      <button id="tab-pay" onclick="showView('pay')" aria-label="Pagamento">💴</button>
    </nav>
  </header>

  <div class="stage" id="stage">

    <!-- MENU -->
    <section class="view active" id="view-menu">
      <div class="menu-grid" id="menu-grid"></div>
    </section>

    <!-- CART -->
    <section class="view" id="view-cart">
      <div id="cart-body"></div>
    </section>

    <!-- PAYMENT -->
    <section class="view" id="view-pay">
      <div class="pay-methods">
        <button data-method="card" class="active" onclick="selectPayment('card')" aria-label="Cartão">
          <span class="ic">💳</span>
        </button>
        <button data-method="cash" onclick="selectPayment('cash')" aria-label="Dinheiro">
          <span class="ic">💵</span>
        </button>
        <button data-method="pix" onclick="selectPayment('pix')" aria-label="Pix">
          <span class="ic">📱</span>
        </button>
      </div>

      <div class="pay-panel" id="pay-panel"></div>

      <button class="cta" id="confirm-btn" onclick="confirmPayment()">
        <span id="confirm-label">Confirmar pagamento</span>
      </button>

      <p class="credit">Feito por <span>IYamada-Dev</span></p>
    </section>

  </div>

  <div class="shoji" id="shoji">
    <div class="leaf l"></div>
    <div class="leaf r"></div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="stamp-overlay" id="stamp-overlay">
  <div class="hanko"><span>済</span></div>
</div>

<script>
  const products = [
    { id:'yakisoba', name:'Yakisoba', emoji:'🍜', price:28, desc:'Macarrão salteado com legumes e molho shoyu' },
    { id:'sushi', name:'Sushi', emoji:'🍣', price:34, desc:'Combinado de nigiri e sashimi do dia' },
    { id:'harumaki', name:'Rolinho Primavera', emoji:'🥟', price:19, desc:'Crocante, recheado com legumes frescos' },
    { id:'onigiri', name:'Onigiri', emoji:'🍙', price:15, desc:'Bolinho de arroz envolto em alga nori' },
  ];

  const STORAGE_KEY = 'iyamada-dev-cart';
  let cart = loadCart(); // id -> qty
  let currentView = 'menu';
  let currentMethod = 'card';
  let isPaying = false;

  const fmt = v => 'R$ ' + v.toFixed(2).replace('.', ',');

  function loadCart(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveCart(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }catch(e){}
  }

  /* ---------- toast ---------- */
  function showToast(msg){
    const wrap = document.getElementById('toast-wrap');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(()=> t.remove(), 2500);
  }

  /* ---------- render menu ---------- */
  function renderMenu(){
    const grid = document.getElementById('menu-grid');
    grid.innerHTML = products.map(p => `
      <div class="dish">
        <div class="plate"><span>${p.emoji}</span></div>
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="price">${fmt(p.price)}</div>
        <button class="add-btn" onclick="addToCart('${p.id}')" aria-label="Adicionar ${p.name} ao carrinho">+</button>
      </div>
    `).join('');
  }

  /* ---------- cart logic ---------- */
  function addToCart(id){
    cart[id] = (cart[id] || 0) + 1;
    saveCart();
    updateBadge();
    renderCart();
    const p = products.find(x=>x.id===id);
    showToast(`${p.name} adicionado`);
  }
  function changeQty(id, delta){
    if(!cart[id]) return;
    cart[id] += delta;
    if(cart[id] <= 0) delete cart[id];
    saveCart();
    updateBadge();
    renderCart();
  }
  function removeItem(id){
    delete cart[id];
    saveCart();
    updateBadge();
    renderCart();
  }
  function cartCount(){
    return Object.values(cart).reduce((a,b)=>a+b,0);
  }
  function cartTotal(){
    return Object.entries(cart).reduce((sum,[id,qty])=>{
      const p = products.find(x=>x.id===id);
      return sum + p.price * qty;
    },0);
  }
  function updateBadge(){
    const badge = document.getElementById('cart-badge');
    const n = cartCount();
    badge.textContent = n;
    badge.style.display = n > 0 ? 'flex' : 'none';
  }

  function renderCart(){
    const body = document.getElementById('cart-body');
    const ids = Object.keys(cart);

    if(ids.length === 0){
      body.innerHTML = `
        <div class="empty-state">
          <div class="plate"><span>🍱</span></div>
          <p>Seu carrinho está vazio</p>
        </div>`;
      return;
    }

    const items = ids.map(id=>{
      const p = products.find(x=>x.id===id);
      const qty = cart[id];
      return `
        <div class="cart-item">
          <div class="cart-emoji">${p.emoji}</div>
          <div class="cart-info">
            <h4>${p.name}</h4>
            <div class="price">${fmt(p.price * qty)}</div>
          </div>
          <div class="cart-actions">
            <div class="stepper">
              <button onclick="changeQty('${id}', -1)" aria-label="Diminuir ${p.name}">–</button>
              <span>${qty}</span>
              <button onclick="changeQty('${id}', 1)" aria-label="Aumentar ${p.name}">+</button>
            </div>
            <button class="remove-btn" onclick="removeItem('${id}')">remover</button>
          </div>
        </div>`;
    }).join('');

    body.innerHTML = `
      <div class="cart-list">${items}</div>
      <div class="total-row">
        <span class="label">Total</span>
        <span class="amount">${fmt(cartTotal())}</span>
      </div>
      <button class="cta" onclick="showView('pay')">Ir para pagamento</button>
    `;
  }

  /* ---------- payment logic ---------- */
  function selectPayment(method){
    currentMethod = method;
    document.querySelectorAll('.pay-methods button').forEach(b=>{
      b.classList.toggle('active', b.dataset.method === method);
    });
    renderPayPanel();
  }

  function renderPayPanel(){
    const panel = document.getElementById('pay-panel');
    if(currentMethod === 'card'){
      panel.innerHTML = `
        <div class="row"><input placeholder="Número do cartão" inputmode="numeric" maxlength="19"></div>
        <div class="row"><input placeholder="Nome impresso no cartão"></div>
        <div class="row row-2">
          <input placeholder="Validade" maxlength="5">
          <input placeholder="CVV" inputmode="numeric" maxlength="4">
        </div>`;
    } else if(currentMethod === 'pix'){
      panel.innerHTML = `
        <div class="qr"></div>
        <p class="pix-hint">Escaneie para pagar ${fmt(cartTotal())}</p>`;
    } else {
      panel.innerHTML = `
        <div class="cash-face">
          <div class="ic">💴</div>
          <input placeholder="Troco para quanto?" style="max-width:220px; text-align:center;">
        </div>`;
    }
  }

  function confirmPayment(){
    const btn = document.getElementById('confirm-btn');
    if(cartCount() === 0){
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
      showToast('Adicione itens ao carrinho antes de pagar');
      return;
    }
    if(isPaying) return;
    isPaying = true;

    const label = document.getElementById('confirm-label');
    btn.disabled = true;
    label.innerHTML = '<span class="spinner"></span> Processando…';

    setTimeout(()=>{
      const overlay = document.getElementById('stamp-overlay');
      overlay.classList.add('show');

      setTimeout(()=>{
        overlay.classList.remove('show');
        cart = {};
        saveCart();
        updateBadge();
        renderCart();
        renderPayPanel();
        showView('menu');
        label.textContent = 'Confirmar pagamento';
        btn.disabled = false;
        isPaying = false;
      }, 1500);
    }, 700);
  }

  /* ---------- view switching w/ shoji transition ---------- */
  function showView(name){
    if(name === currentView) return;
    const shoji = document.getElementById('shoji');
    shoji.classList.add('cover');

    setTimeout(()=>{
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');

      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');

      currentView = name;
      if(name === 'cart') renderCart();
      if(name === 'pay') renderPayPanel();

      shoji.classList.remove('cover');
    }, 420);
  }

  /* ---------- init ---------- */
  renderMenu();
  renderCart();
  renderPayPanel();
  updateBadge();

  window.addEventListener('load', ()=>{
    setTimeout(()=> document.getElementById('splash').classList.add('hide'), 500);
  });
</script>

</body>
</html>
